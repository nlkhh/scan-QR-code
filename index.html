<style>
:root{--bar:#0a7cff;--bg:#fff;--card:#f1f3f7;--fg:#15171c;--mut:#667;--line:#dde1ea;--acc:#1e7cf2;--ok:#12a150;--bad:#d93a45;--warn:#d98a00;--drawer:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--card:#262626;--fg:#f2f2f2;--mut:#9a9a9a;--line:#333;--acc:#4797ff;--ok:#4fdc8a;--bad:#ff6b75;--warn:#ffb84d;--drawer:#222}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;font-size:16px;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:50}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.top{background:var(--bar);color:#fff;height:56px;flex:none;display:flex;align-items:center;padding:0 6px;gap:6px}
.top h1{font-size:20px;font-weight:500;margin:0;flex:1;text-align:center}
.ib{background:none;border:0;color:inherit;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center}
.ib:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;position:relative;overflow:auto}
.view{display:none;height:100%}.view.on{display:block}
#v-scan.on{display:block;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;height:56px;color:#fff;z-index:3}
.sbar .ib{color:#fff;text-shadow:0 0 6px #0008}
.frame{position:absolute;left:50%;top:44%;width:min(75vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #fff6;z-index:2}
.frame i{position:absolute;width:26px;height:26px;border:5px solid #3b8cff}
.frame i:nth-child(1){left:-5px;top:-5px;border-right:0;border-bottom:0}.frame i:nth-child(2){right:-5px;top:-5px;border-left:0;border-bottom:0}
.frame i:nth-child(3){left:-5px;bottom:-5px;border-right:0;border-top:0}.frame i:nth-child(4){right:-5px;bottom:-5px;border-left:0;border-top:0}
.frame u{position:absolute;left:0;right:0;height:2px;background:#e5484d;top:10%;animation:s 2.4s ease-in-out infinite alternate}
@keyframes s{to{top:90%}}
@media(prefers-reduced-motion:reduce){.frame u{animation:none;top:50%}}
.zoom{position:absolute;left:14px;right:14px;bottom:70px;display:flex;align-items:center;gap:12px;color:#fff;z-index:3}

.msg.on{display:grid}

.pad{padding:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:15px}.row small{color:var(--mut);display:block;word-break:break-all}
.row .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hd{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.hd .ic{font-size:26px;width:40px;text-align:center}
.txt{padding:16px;font-size:22px;line-height:1.35;background:var(--card);border-bottom:1px solid var(--line);word-break:break-all;text-decoration:underline;user-select:text}
.badge{margin:12px 16px 0;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.45;border-left:5px solid}
.badge.g{border-color:var(--ok);color:var(--ok)}.badge.w{border-color:var(--warn);color:var(--warn)}.badge.r{border-color:var(--bad);color:var(--bad)}
.badge{background:var(--card)}
.acts{display:flex;justify-content:space-around;padding:20px 8px;margin-top:12px;background:var(--card);border-block:1px solid var(--line)}

.acts span{font-size:38px;color:var(--acc);line-height:1}
canvas.q{display:block;margin:20px auto;max-width:70%;height:auto;border-radius:6px;image-rendering:pixelated}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
select,input[type=text],input[type=password],textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px}
.cr{display:flex;gap:16px;align-items:center}
input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sw select{width:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(78%,320px);background:var(--drawer);z-index:30;transform:translateX(-102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:4px 0 20px #0006}
.drawer.on{transform:none}
.scrim{position:absolute;inset:0;background:#0008;z-index:29;display:none}.scrim.on{display:block}
.drawer button{background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:18px;text-align:left;padding:0 18px;height:60px;display:flex;align-items:center;gap:22px;cursor:pointer}
.drawer button span{width:28px;text-align:center;font-size:22px}
.drawer button.cur{color:var(--acc);background:#8883}
.ad{flex:none;height:46px;background:var(--card);border-top:1px solid var(--line);color:var(--mut);font-size:12px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;display:none;max-width:86%}
.empty{color:var(--mut);text-align:center;padding:50px 20px}
.pl{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}.pl.on{border:2px solid var(--acc)}.pl h3{margin:0 0 6px}.pl ul{margin:6px 0 12px;padding-left:20px;line-height:1.7}

*{-webkit-tap-highlight-color:transparent}
body{-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation}
.txt,textarea,input[type=text]{-webkit-user-select:text;user-select:text}
.i{display:block;flex:none}.ib .i{margin:auto}
.top{box-shadow:0 2px 6px #0004;position:relative;z-index:5}

.acts span{display:block;line-height:0}
.hd .ic{color:var(--acc);display:grid;place-items:center}
.badge{display:flex;gap:10px;align-items:flex-start}.badge .i{margin-top:1px}

.drawer button span{display:grid;place-items:center;width:28px;font-size:0}
label .i,.sw .i{display:inline-block;vertical-align:-2px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
input[type=checkbox]:checked{background:var(--acc)}input[type=checkbox]:checked::after{left:23px}
.pl h3 .i{display:inline-block;vertical-align:-3px;color:var(--ok)}
@media(min-width:700px){#app{max-width:440px;margin:0 auto;border-inline:1px solid var(--line)}}

#login{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 30px)}
#login.on{display:block}.lw{max-width:380px;margin:0 auto}
.lb{display:flex;align-items:center;gap:10px;margin-bottom:22px}.lb b{flex:1;font-size:20px;font-weight:500}.lb .btn{padding:6px 14px;font-size:14px}#lg-ic{color:var(--acc)}
.mut{color:var(--mut)}.lw h3{margin:0 0 4px;font-size:24px;font-weight:500}
#login input{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.gbtn{width:100%;display:flex;gap:10px;align-items:center;justify-content:center;font:inherit;font-weight:500;background:#fff;color:#222;border:1px solid #cfd3da;border-radius:10px;padding:12px;cursor:pointer;margin-top:12px}
.or{text-align:center;color:var(--mut);margin:16px 0;display:flex;align-items:center;gap:10px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{flex:1;font:inherit;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:10px;cursor:pointer}.tabs button.on{color:var(--acc);border-color:var(--acc)}
.lmsg{color:var(--bad);min-height:22px;font-size:14px}
#lg-prof .btn,#pn-p>.btn,#lg-cd .btn{width:100%}
.acc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:6px}.acc b{font-size:18px}.acc small{display:block;color:var(--mut);margin-top:2px}.acc .btn{margin-top:10px}
</style>

// ---- result
function kind(s){if(/^https?:\/\//i.test(s))return["URL","link"];if(/^otpauth:/i.test(s))return["OTP","key"];if(/^WIFI:/i.test(s))return["WIFI","wifi"];if(/^tel:/i.test(s))return["PHONE","phone"];if(/^mailto:/i.test(s))return["EMAIL","mail"];return["TEXT","doc"]}
function check(s){var r=[];var m=s.match(/^https?:\/\/([^\/?#]+)/i);if(!m)return null;var h=m[1].toLowerCase();
 if(/@/.test(h))r.push(t("r_at"));var host=h.replace(/^.*@/,"").replace(/:\d+$/,"");
 if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host))r.push(t("r_ip"));
 if(/\.(xyz|top|tk|ml|ga|cf|gq|click|zip|mov|work|loan|icu)$/.test(host))r.push(t("r_tld"));
 if(/xn--/.test(host))r.push(t("r_puny"));if(host.split(".").length>4||host.split("-").length>3)r.push(t("r_sub"));
 if(/(login|verify|bonus|claim|prize|gift|wallet|secure|update|account|otp)/.test(host+new URL(s,"http://x").pathname.toLowerCase()))r.push(t("r_kw"));
 if(/^(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|rb\.gy)$/.test(host))r.push(t("r_short"));
 return{r:r,http:/^http:/i.test(s)}}
function found(txt,fmt){if(lock)return;lock=true;if(S.vib&&navigator.vibrate)navigator.vibrate(60);
 var it={text:txt,fmt:fmt,time:Date.now(),fav:false};
 var ex=S.hist.filter(function(h){return h.text===txt})[0];if(ex)it.fav=ex.fav;
 S.hist=[it].concat(S.hist.filter(function(h){return h.text!==txt})).slice(0,S.pro?1000:20);sv();if(window.FB)FB.count();show(it)}
function show(it){curItem=it;var k=kind(it.text),c=S.safe?check(it.text):null,b="";
 if(k[0]==="OTP")b='<div class="badge w">'+I("warn",22)+'<span>'+t("otp")+'</span></div>';
 else if(c&&c.r.length)b='<div class="badge r">'+I("warn",22)+'<span>'+t("bad")+'<br>• '+c.r.map(esc).join("<br>• ")+'</span></div>';
 else if(c&&c.http)b='<div class="badge w">'+I("warn",22)+'<span>'+t("http")+'</span></div>';
 else if(c)b='<div class="badge g">'+I("shield",22)+'<span>'+t("safeok")+'</span></div>';
 $("v-res").innerHTML='<div class="hd"><div class="ic">'+I(k[1],28)+'</div><div style="flex:1"><b style="font-size:20px">'+(k[0]==="OTP"?"URL":k[0])+'</b><br><span style="color:var(--mut)">'+new Date(it.time).toLocaleString()+', '+esc(it.fmt)+'</span></div><button class="ib" id="rf" aria-label="Favorite" style="color:var(--mut)">'+I(it.fav?"star":"starO")+'</button></div><div class="txt">'+esc(it.text)+'</div>'+b+
 '<div class="acts"><button id="ro"><span>'+I("open",36)+'</span>'+t("open")+'</button><button id="rs"><span>'+I("share",36)+'</span>'+t("share")+'</button><button id="rc"><span>'+I("copy",36)+'</span>'+t("copy")+'</button></div><canvas class="q" id="rq"></canvas>';
 draw($("rq"),it.text,"#000","#fff",6);
 $("rf").onclick=function(){if(!it.fav&&!favOK())return;it.fav=!it.fav;var h=S.hist.filter(function(x){return x.text===it.text})[0];if(h)h.fav=it.fav;sv();this.innerHTML=I(it.fav?"star":"starO");toast(t(it.fav?"fon":"foff"))};
 $("ro").onclick=function(){var u=it.text;if(/^(https?:|tel:|mailto:)/i.test(u)){if(c&&c.r.length&&!confirm(t("bad")+"\n"+c.r.join(", ")))return;window.open(u,"_blank","noopener")}else toast(t("copy")+"?")};
 $("rs").onclick=function(){if(navigator.share)navigator.share({text:it.text}).catch(function(){});else cp(it.text)};
 $("rc").onclick=function(){cp(it.text)};go("res")}
function cp(s){var d=function(){toast(t("copied"))};try{navigator.clipboard.writeText(s).then(d,function(){old()})}catch(e){old()}
 function old(){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();d()}}

function list(v){var h=S.hist.filter(function(x){return v==="his"||x.fav}),el=$(v==="his"?"v-his":"v-fav");
 if(!h.length){el.innerHTML='<div class="empty">'+t("empty")+'</div>';return}
 el.innerHTML=h.map(function(x,i){var k=kind(x.text);return '<div class="row" data-t="'+i+'" tabindex="0"><span style="color:var(--acc)">'+I(k[1])+'</span><div class="t"><b class="tx">'+esc(x.text)+'</b><small>'+new Date(x.time).toLocaleString()+' · '+esc(x.fmt)+'</small></div><button class="ib" data-f="'+i+'" style="color:var(--mut)" aria-label="Favorite">'+I(x.fav?"star":"starO")+'</button><button class="ib" data-d="'+i+'" style="color:var(--mut)" aria-label="Delete">'+I("delete")+'</button></div>'}).join("")+(v==="his"?'<p class="pad"><button class="btn alt" id="clr">'+t("clear")+'</button>'+(S.pro?' <button class="btn alt" id="exp">'+t("exp")+'</button>':'')+'</p>':"");
 el.onclick=function(e){var r=e.target.closest("[data-t]");if(!r)return;var x=h[+r.dataset.t],f=e.target.closest("[data-f]"),d=e.target.closest("[data-d]");
  if(f){if(!x.fav&&!favOK())return;x.fav=!x.fav;sv();list(v)}else if(d){S.hist=S.hist.filter(function(y){return y!==x});sv();list(v)}else show(x)};
 var c=$("clr");if(c)c.onclick=function(){S.hist=S.hist.filter(function(x){return x.fav});sv();list(v)};var ex=$("exp");if(ex)ex.onclick=function(){var q=function(x){return '"'+String(x).replace(/"/g,'""')+'"'},rows=["time,format,favorite,text"].concat(S.hist.map(function(x){return [new Date(x.time).toISOString(),x.fmt,x.fav,q(x.text)].join(",")}));var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv"}));a.download="history.csv";document.body.appendChild(a);a.click();a.remove()}}

function draw(cn,s,fg,bg,cell){try{var q=qrcode(0,"M");q.addData(s);q.make();var n=q.getModuleCount(),m=2,z=cell||8;cn.width=cn.height=(n+m*2)*z;var g=cn.getContext("2d");g.fillStyle=bg;g.fillRect(0,0,cn.width,cn.height);g.fillStyle=fg;
 for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+m)*z,(r+m)*z,z,z);return true}catch(e){toast("Too long");return false}}

$("upg").onclick=function(){toast(t("needpro"))}}
["fg","bg"].forEach(function(i){$(i).addEventListener("click",function(e){if(!S.pro){e.preventDefault();need()}})});

 $("slang").value=S.lang;$("sthm").value=S.theme;$("svib").checked=S.vib;$("ssafe").checked=S.safe;plans();
 var m={"l-type":"type","s-lang":"lang","s-theme":"theme","s-vib":"vib","s-safe":"safe","s-note":"note","l-fg":"fg","l-bg":"bg","gen":"gen","csave":"save","cshare":"share"};

// ---- login + cloud
function lgMsg(m){$("lg-msg").textContent=m||""}
function errT(e){return String((e&&e.code)||(e&&e.message)||"error").replace("auth/","").replace(/-/g," ")}
function showLogin(mode){stopCam();openD(false);$("login").classList.add("on");$("lg-auth").hidden=mode==="profile";$("lg-prof").hidden=mode!=="profile";lgMsg("")}
function hideLogin(){$("login").classList.remove("on")}
function busy(b,on){b.disabled=on;b.style.opacity=on?.6:1}
function tab(p){$("pn-e").hidden=p;$("pn-p").hidden=!p;$("tb-e").classList.toggle("on",!p);$("tb-p").classList.toggle("on",p);lgMsg("")}

 acct();go("scan")}

 e.innerHTML='<div class="acc"><b>'+esc(p.name)+'</b><small>'+esc(p.email||p.phone||"")+' · '+esc(p.age)+'</small><small>'+t("cloud")+'</small><button class="btn alt" id="so" type="button">'+t("out")+'</button></div>';

ld();ui();S.pro=false;ui();authInit();
